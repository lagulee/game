<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 글자가 깨지지 않도록 문자 인코딩을 UTF-8로 정한다 -->
  <meta charset="UTF-8">
  <!-- 휴대폰에서 화면 폭에 맞추고, 두 손가락 확대·두 번 탭 확대를 막는다 (게임 조작과 겹치지 않게) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- 브라우저 탭에 보일 제목 -->
  <title>증강 선택형 2D 슈팅</title>
  <!-- Google Fonts에서 귀여운 한글 글꼴 Jua, Black Han Sans를 불러온다 -->
  <!-- (인터넷이 안 되면 불러오지 못하고, 대신 sans-serif 기본 글꼴이 쓰인다) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
  <!-- 화면 꾸밈(색, 위치)은 style.css에서 불러온다 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 게임이 그려질 도화지(캔버스). 게임 안의 좌표는 960 x 540,
       화면에 보이는 크기는 game.js 의 fitCanvas() 가 창 크기에 맞춰 키운다 -->
  <canvas id="game" width="960" height="540"></canvas>


  <!-- 숫자 조절판: 다른 파일의 상수가 tune() 을 쓰므로 가장 먼저 불러온다 -->
  <script src="tuning.js"></script>
  <!-- 영구 저장 장치 (코인, 업그레이드 레벨) -->
  <script src="save.js"></script>
  <!-- 증강 데이터를 먼저 불러온다 (game.js가 이 데이터를 사용하기 때문) -->
  <script src="augments.js"></script>
  <!-- 적 종류 데이터 -->
  <script src="enemies.js"></script>
  <!-- 웨이브 구성 데이터 -->
  <script src="waves.js"></script>
  <!-- 영구 업그레이드 데이터 -->
  <script src="upgrades.js"></script>
  <!-- 발동 스킬 데이터 (상점에서 사서 한 판에 1개 장착, Space · 오른쪽 클릭으로 쓴다) -->
  <script src="skills.js"></script>
  <!-- 게임 본체 -->
  <script src="game.js"></script>
  <!-- 모바일 모드: 조이스틱, 일시정지·디버그 터치 버튼 (설정에서 켠다) -->
  <script src="mobile.js"></script>
</body>
</html>
